name: iOS unsigned validation
on:
  push:
    branches: [feat/unified-ios]
    paths: ['native-app/**', '.github/workflows/ios-unsigned.yml']
  pull_request:
    paths: ['native-app/**', '.github/workflows/ios-unsigned.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm test
      - run: npx cap sync ios
      - name: Compile for iPhone without signing
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ios/DerivedData-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > device-build.log 2>&1 || { tail -n 100 device-build.log; exit 1; }
      - name: Compile and launch simulator
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData-simulator CODE_SIGNING_ALLOWED=NO build > simulator-build.log 2>&1 || { tail -n 100 simulator-build.log; exit 1; }
          xcrun simctl list devices available --json > simulator-devices.json
          DEVICE=$(python3 -c 'import json; d=json.load(open("simulator-devices.json")); print(next(x["udid"] for k,v in sorted(d["devices"].items(),reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" ios/DerivedData-simulator/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" jp.neocarnivore.planner.preview
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" jp.neocarnivore.planner.preview data)
          for attempt in $(seq 1 30); do
            sleep 2
            if test -f "$CONTAINER/Documents/launch-diagnostics.json"; then
              cp "$CONTAINER/Documents/launch-diagnostics.json" launch-diagnostics.json
              if python3 -c 'import json,sys; d=json.load(open("launch-diagnostics.json")); sys.exit(0 if d.get("ready") and d.get("frameReady") and d.get("headerTop",0)>0 else 1)'; then break; fi
            fi
          done
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'process == "App"' > simulator-runtime.log 2>&1
          xcrun simctl io "$DEVICE" screenshot simulator-launch.png
          cat launch-diagnostics.json
          python3 -c 'import json; d=json.load(open("launch-diagnostics.json")); assert d.get("ready") and d.get("frameReady") and d.get("headerTop",0)>0, d'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-validation-${{ github.run_number }}
          retention-days: 7
          path: |
            native-app/*-build.log
            native-app/simulator-launch.png
            native-app/simulator-devices.json
            native-app/launch-diagnostics.json
            native-app/simulator-runtime.log
            native-app/playwright-report/
            native-app/docs/calculation-results.json
