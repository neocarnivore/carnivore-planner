name: iOS signed TestFlight
on:
  workflow_dispatch:
    inputs:
      upload:
        type: boolean
        description: 'Upload signed IPA to App Store Connect'
        default: false
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-15
    environment: app-store
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native-app/package-lock.json
      - run: npm ci
      - run: node scripts/set-bundle-id.mjs && npm run build && npx cap sync ios
      - name: Sign and export
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: bash scripts/archive-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: signed-ipa
          path: native-app/build/export/*.ipa
          retention-days: 1
      - name: Upload to App Store Connect
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file build/export/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/planner-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/planner-cert.p12" "$RUNNER_TEMP/planner.mobileprovision"
          rm -rf "$HOME/.appstoreconnect/private_keys"
          if test -f "$RUNNER_TEMP/planner-profile-path"; then rm -f "$(cat "$RUNNER_TEMP/planner-profile-path")"; fi
